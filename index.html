<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10172f" />
    <meta name="description" content="ORBIT 2 — A bigger gravity adventure. Explore 32 floating puzzles, master momentum and unlock spectacular ball skins." />
    <title>ORBIT 2 — Small ball. Big adventure.</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      #boot{position:fixed;inset:0;z-index:100;background:#10172f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#f0f5ff;font:28px system-ui;letter-spacing:5px}#boot[hidden]{display:none}#boot small{font:12px system-ui;letter-spacing:.3px}#boot .boot-orbit{color:#76e7df;font-size:54px}.load-track{width:min(300px,75vw);height:4px;background:#364768;border-radius:4px;overflow:hidden}.load-track span{height:100%;display:block;background:#76e7df;transition:width .15s}.load-track.indeterminate span{width:30%;animation:load-scan 1s infinite alternate}#load-percent{font:11px system-ui;letter-spacing:1px}@keyframes load-scan{to{transform:translateX(230%)}}
    </style>
  </head>
  <body>
    <canvas id="world" aria-label="ORBIT 2 three-dimensional world"></canvas>
    <div id="boot" role="status"><span class="boot-orbit">◉</span><span>ORBIT 2</span><small id="load-stage">Downloading game files…</small><div id="load-progress" class="load-track indeterminate" role="progressbar" aria-label="Loading game" aria-valuemin="0" aria-valuemax="100"><span id="load-fill"></span></div><small id="load-percent">Preparing your universe</small></div>
    <noscript>Enable JavaScript to play ORBIT 2.</noscript>
    <script type="module" src="/src/boot.js"></script>
  </body>
</html>
