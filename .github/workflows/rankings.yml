name: Validate ORBIT 2 ranked run
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Public ORBIT RUN issue number to review and validate
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: orbit-rankings-write
  queue: max
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.user.type == 'User' && startsWith(github.event.issue.title, '[ORBIT RUN]') && contains(github.event.issue.body, '```orbit-run')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write
      issues: write
    steps:
      # Always execute trusted main-branch code. Issue text is parsed only as data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Validate submission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: node scripts/validate-submission.mjs
