name: Validate ORBIT 2 ranked run
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Public ORBIT RUN issue number to review and validate
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: orbit-rankings-write
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      issues: write
    steps:
      # Always execute trusted main-branch code. Issue text is parsed only as data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Exercise replay validation and concurrent score storage
        run: node --test tests/replay.test.js tests/rankings.test.js tests/name-policy.test.js tests/moderation.test.js
      - name: Validate submission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node scripts/validate-submission.mjs
