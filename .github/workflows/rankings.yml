name: Validate ORBIT 2 ranked run
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[ORBIT RUN]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      issues: write
    steps:
      # Always execute trusted main-branch code. Issue text is parsed only as data.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise replay validation and concurrent score storage
        run: node --test tests/replay.test.js tests/rankings.test.js
      - name: Validate submission
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/validate-submission.mjs
